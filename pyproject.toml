[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-ecosystem"
version = "0.1.0"
description = "Evidence-backed talent discovery MVP"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
