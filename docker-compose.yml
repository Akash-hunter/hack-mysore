services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talent_ecosystem}
      POSTGRES_USER: ${POSTGRES_USER:-talent_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talent_app} -d ${POSTGRES_DB:-talent_ecosystem}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
